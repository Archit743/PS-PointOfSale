services:
  - type: web
    name: pradeep-sales-pos
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pradeep_sales_pos
      - key: APP_PASSWORD
        sync: false
