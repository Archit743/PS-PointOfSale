name: Keep Render POS warm

on:
  schedule:
    # Offset from the hour to reduce GitHub Actions scheduling delays.
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping POS health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 90
          --retry 3 --retry-delay 10 --retry-all-errors
          https://pradeep-sales-pos.onrender.com/api/health
